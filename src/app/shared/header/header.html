<!-- cria a estrutura do header -->
<header class="header">
    <div class="header-container">
        <div class="header-esquerda">
            <a class="logo" href="">
                <img class="logo-svg" src="/assets/icons/logo3.svg" alt="">
            </a>
        </div>

        <div class="header-centro">
            <form action="">
                <input type="search" name="search" placeholder="Busque aqui seu produto">
                <button class="botao-pesquisa" type="submit">
                    <img class="icone" src="/assets/icons/busca.svg" alt="">
                </button>
            </form>
        </div>

        <div class="header-direita">
            <a href="/carrinho"><img class="icone" src="/assets/icons/carrinho.svg" alt=""></a>
            @if (autenticacaoService.estaLogado()) {
            <div class="menu-usuario">
                @if (autenticacaoService.recuperarUsuario()?.tipo === 'admin') {
                <a href="/gestao"><img class="icone" src="/assets/icons/usuario.svg" alt=""></a>
                } @else {<a><img class="icone" src="/assets/icons/usuario.svg" alt=""></a>}

                <div class="opcoes-usuario">
                    <button (click)="sair()">Sair</button>
                </div>
            </div>
            } @else {
            <a routerLink="/login"><img class="icone" src="/assets/icons/usuario.svg" alt=""></a>
            }
        </div>
    </div>
</header>
