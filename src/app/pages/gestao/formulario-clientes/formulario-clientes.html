<div class="pagina">



    <main class="content-container">

        <h1>Formulário de Cadastro de Clientes</h1>

        <form class="formulario">

            <div class="campo campo-id">
                <label for="id">ID</label>
                <input type="number" id="id" name="id" placeholder="Digite o id">
            </div>

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome" required>
            </div>

            <div class="campo">
                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite o sobrenome">
            </div>

            <div class="campo">
                <label for="dtNascimento">Data de Nascimento</label>
                <input type="date" id="dtNascimento" name="dtNascimento">
            </div>

            <button type="submit" class="btn-cadastrar" (click)="onBotaoClicado()">
                Cadastrar
            </button>

        </form>

    </main>

</div>
