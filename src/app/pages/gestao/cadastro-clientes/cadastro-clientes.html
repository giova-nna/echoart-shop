<div class="content-container">


    <div class="tabela-container">
        <div class="topo">
            <h1>Clientes Cadastrados</h1>
            <form class="busca" action="">
                <input type="search" name="search" id="search" placeholder="Buscar...">
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Sobrenome</th>
                    <th>CPF</th>
                    <th>Data de Nascimento</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>

                @for (cliente of listaClientes; track cliente ){
                <tr>
                    <td>{{ cliente.id }}</td>
                    <td>{{ cliente.nome }}</td>
                    <td>{{ cliente.sobrenome }}</td>
                    <td>{{ cliente.cpf }} </td>
                    <td>{{ cliente.dataNascimento }}</td>

                    <td class="acoes">
                        <button class="btn-editar" (click)="onBotaoClicado()">
                            Editar
                        </button>

                        <button class="btn-excluir" (click)="onBotaoClicado()">
                            Excluir
                        </button>
                    </td>
                </tr>
                }

            </tbody>
        </table>
    </div>


    <button class="btn-incluir" (click)="onBotaoClicado()" routerLink="/gestao/formulario-clientes">
        Incluir
    </button>

</div>
