<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro-clientes.css">
</head>
<body>
    

<div class="pagina">


    
    <main class="content-container">

        <h1>Cadastro de Pessoas</h1>

        <form class="formulario" (ngSubmit)="Cadastrar()">

            <div class="campo campo-id">
                <label for="id">ID</label>
                <input
                    type="number"
                    id="id"
                    name="id"
                    placeholder="Digite o id"
                    [(ngModel)]="pessoa.id">
            </div>

            <div class="campo">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite o nome"
                    [(ngModel)]="pessoa.Nome"
                    required>
            </div>

            <div class="campo">
                <label for="sobrenome">Sobrenome</label>
                <input
                    type="text"
                    id="sobrenome"
                    name="sobrenome"
                    placeholder="Digite o sobrenome"
                    [(ngModel)]="pessoa.Sobrenome"
                    required>
            </div>

            <div class="campo">
                <label for="dtNascimento">Data de Nascimento</label>
                <input
                    type="date"
                    id="dtNascimento"
                    name="dtNascimento"
                    [(ngModel)]="pessoa.dtNascimento"
                    required>
            </div>

            <button type="submit" class="btn-cadastrar">
                Cadastrar
            </button>

        </form>

    </main>

</div>
</body>
</html>
