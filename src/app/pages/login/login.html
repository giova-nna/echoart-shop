<div class="container-login">
    <div>
        <div class="login-titulo">
            <h1> <img class="icone" src="/assets/icons/musica.svg" alt="">CONECTE-SE COM A MÚSICA</h1>
        </div>
        <div class=" form-login">
            <form action="*">
                <label for="email"> <img src="" alt="">Login</label>
                <input class="input-login" type="email" name="email" id="email" placeholder="E-mail"
                    (keyup)="habilitarBotao()" [(ngModel)]="login">
                <label for="email">Senha</label>
                <input class="input-login" type="password" name="senha" id="senha" placeholder="Senha"
                    (keyup)="habilitarBotao()" [(ngModel)]="senha">>

                <div class="botoes-input">
                    <button class="botao-login" type="submit" (click)="fazerLogin()">
                        ENTRAR
                    </button>
                    <button class="botao-recuperar-senha" type="reset" [disabled]="botaoDesabilitado"
                        (click)="onBotaoClicadoRecuperarSenha()">
                        Esqueci minha senha
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
